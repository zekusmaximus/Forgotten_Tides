name: Compile Stories

on:
  push:
    paths:
      - 'stories/**'
      - '!stories/README.md'
      - 'scripts/compile_stories.sh'
      - 'scripts/compile_stories.js'
      - 'scripts/lib/scene_indexer.js'
      - 'scripts/lib/path_safety.js'
      - 'scripts/tests/test_compile_stories.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/compile-stories.yml'
  pull_request:
    paths:
      - 'stories/**'
      - '!stories/README.md'
      - 'scripts/compile_stories.sh'
      - 'scripts/compile_stories.js'
      - 'scripts/lib/scene_indexer.js'
      - 'scripts/lib/path_safety.js'
      - 'scripts/tests/test_compile_stories.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/compile-stories.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Test story compilation
        run: node scripts/tests/test_compile_stories.js

      - name: Compile stories
        run: scripts/compile_stories.sh

      - name: Upload compiled stories
        uses: actions/upload-artifact@v4
        with:
          name: forgotten-tides-stories
          path: |
            out/compiled/forgotten_tides_stories.md
            out/compiled/forgotten_tides_stories.epub

      - name: Write workflow summary
        run: |
          {
            echo "## Story compilation artifacts";
            echo "";
            echo "- out/compiled/forgotten_tides_stories.md";
            echo "- out/compiled/forgotten_tides_stories.epub";
          } >> "$GITHUB_STEP_SUMMARY"
