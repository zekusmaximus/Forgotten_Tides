# The era control (decisions Q30, Q31; rule R15). Two discrete states,
# before and after the Tessarine Breach. Only states canon ties to the
# breach are listed; everything else is the same in both eras. No state
# carries a figure: a pre-breach sounding reads "unmeasured" after it.
