# Atlas map placement file.
#
# Every radius, angle, size, and drawn count here is cartographic (P.A.,
# position approximate). Claims (T#) and drawing rules (R#) cite the register
# in design/map/CARTOGRAPHIC_BRIEF.md; sources cite files, path:line ranges,
# or timeline event IDs. Densities are read from atlas frontmatter and never
# repeated here. `npm run lint:map` checks this file against canon, and
# `npm run map:data` builds the viewer's data from it.
#
# Coordinates: r in chart units (1.0 = the Black Horizon's near edge; no
# distance implied), theta in degrees counterclockwise from the chart's
# right-hand side.

schema_version: v1.0.0

frame:
  units: chart_radius
  angles: degrees counterclockwise from the chart's right-hand side
  note: No distance is implied. Corridor legs are counted in pulls (term-0033), never converted.

field:
  blend: 0.02          # edge softening between regions, chart units
  site_sigma: 0.01     # reach of a site's own density
  belt_spread: 0.15    # the Drift runs from its value + spread (inner) to - spread (outer)
  radial:
    core: loc-0005
    belt: loc-0008
    perimeter: loc-0007
  overlays: [loc-0003, loc-0004, loc-0006]

regions:
